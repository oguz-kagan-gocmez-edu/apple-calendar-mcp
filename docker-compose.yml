# Self-hosted remote connector. Put a TLS reverse proxy (Caddy, a tunnel, or your
# host's HTTPS) in front: claude.ai only connects to https:// URLs.
services:
  calendar:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"   # local only; expose through your HTTPS proxy/tunnel
    volumes:
      - calendar-data:/data      # OAuth clients and hashed tokens survive restarts
    restart: unless-stopped
    # Least privilege: nothing but /data (and a small /tmp) is writable.
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  calendar-data:
