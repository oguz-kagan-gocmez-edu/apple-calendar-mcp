name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only reads the repo; keep the workflow token read-only.
permissions:
  contents: read

jobs:
  test:
    name: Lint + test (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --group dev --extra remote
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest --cov=apple_calendar_mcp --cov-report=term-missing
      # On macOS, import the real PyObjC bindings: catches renamed EventKit
      # symbols. We never call EventKit here; CI runners have no GUI session
      # to show the permission prompt.
      - if: runner.os == 'macOS'
        run: uv run python -c "import apple_calendar_mcp.eventkit_store as m; print(m.EventKitStore.authorization_status())"
      # Build the helper app bundle for real and check its signature and launcher.
      - if: runner.os == 'macOS'
        run: |
          uv run apple-calendar-mcp install-app --dest "$RUNNER_TEMP/Apple Calendar MCP.app"
          codesign --verify --verbose "$RUNNER_TEMP/Apple Calendar MCP.app"
          "$RUNNER_TEMP/Apple Calendar MCP.app/Contents/MacOS/apple-calendar-mcp-launcher" /bin/echo launcher-ok

  docker:
    name: Docker image (remote connector)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t apple-calendar-mcp .
      # Start with demo data (no iCloud account in CI) and check it serves and requires a token.
      - run: |
          docker run -d --name cal -p 8000:8000 \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            -e PUBLIC_URL=http://localhost:8000 -e CONNECTOR_PASSWORD=ci-only-password-123 \
            apple-calendar-mcp apple-calendar-mcp --backend memory --demo serve-http
          for i in $(seq 1 30); do curl -fs http://localhost:8000/healthz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/mcp)" = "401"
          docker logs cal

  worker:
    name: Cloudflare Worker (remote connector)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      # Radicale (a Python dev dependency) is the CalDAV server the worker's tests talk to.
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked --group dev
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # The bundle must build and stay under the free plan's 3 MB limit.
      - run: npx wrangler deploy --dry-run --outdir dist
      - run: test "$(gzip -c dist/index.js | wc -c)" -lt 3000000
